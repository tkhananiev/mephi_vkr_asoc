# Semgrep и Gitleaks по текущему репозиторию + отправка в Atomic ASOC (POST /api/v1/findings/ingest).
# Положите этот файл и каталог ci/ в корень своего проекта GitLab (например WebGoat).
#
# Авторизация ingest (одно из двух):
#   ASOC_CONSOLE_JWT — JWT пользователя консоли (role=user); прогон привяжется к вашему owner_user_id (группы/отчёт в UI).
#   ASOC_API_KEY — только ключ приложения; находки без владельца (общий контур).
# Если задан ASOC_CONSOLE_JWT, запрос идёт только с Bearer (не смешивать с X-API-Key — иначе api-service не подставит владельца).
# Опционально: ASOC_INGEST_URL; ASOC_CONSOLE_PRODUCT_ID — id из GET /api/v1/console/products (в теле ingest как console_product_id + в metadata находок).
# Отчёт/группы только по этому продукту: GET .../report/vulnerabilities?console_product_id=<id> и .../groups?... (с JWT пользователя).

stages:
  - security
  - report

semgrep:
  stage: security
  image:
    name: semgrep/semgrep:latest
    entrypoint: [""]
  script:
    - cd "$CI_PROJECT_DIR"
    - semgrep --version
    - semgrep scan --config auto --metrics=off --json --output "$CI_PROJECT_DIR/semgrep-report.json" .
  artifacts:
    when: always
    paths:
      - semgrep-report.json
    expire_in: 1 week
  allow_failure: true

gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.24.0
    entrypoint: [""]
  script:
    - cd "$CI_PROJECT_DIR"
    - gitleaks version
    # --exit-code 0 — отчёт всегда на диске; пайплайн не обрывается до отправки в ASOC.
    - gitleaks detect --source="$CI_PROJECT_DIR" --report-format json --report-path "$CI_PROJECT_DIR/gitleaks-report.json" -v --redact --exit-code 0
  artifacts:
    when: always
    paths:
      - gitleaks-report.json
    expire_in: 1 week
  allow_failure: true

.send_asoc_rules:
  rules:
    - if: $ASOC_API_KEY
    - if: $ASOC_CONSOLE_JWT

semgrep_send_asoc:
  stage: report
  extends: .send_asoc_rules
  image:
    name: python:3.12-alpine
  needs:
    - job: semgrep
      artifacts: true
  before_script:
    - apk add --no-cache curl ca-certificates
  script:
    - set -e
    - ASOC_INGEST_URL="${ASOC_INGEST_URL:-https://atomic-asoc.ru/api/v1/findings/ingest}"
    - test -f semgrep-report.json || echo '{"results":[]}' > semgrep-report.json
    - python3 ci/semgrep_to_asoc_payload.py semgrep-report.json > ingest-semgrep.json
    - |
      set -e
      if [ -n "${ASOC_CONSOLE_JWT:-}" ]; then
        CODE=$(curl -sS -o /tmp/asoc-semgrep.body -w "%{http_code}" -X POST "$ASOC_INGEST_URL" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${ASOC_CONSOLE_JWT}" \
          --data-binary @ingest-semgrep.json)
      elif [ -n "${ASOC_API_KEY:-}" ]; then
        CODE=$(curl -sS -o /tmp/asoc-semgrep.body -w "%{http_code}" -X POST "$ASOC_INGEST_URL" \
          -H "Content-Type: application/json" \
          -H "X-API-Key: ${ASOC_API_KEY}" \
          --data-binary @ingest-semgrep.json)
      else
        echo "Set ASOC_CONSOLE_JWT or ASOC_API_KEY" >&2
        exit 1
      fi
      echo "HTTP ${CODE}"
      cat /tmp/asoc-semgrep.body
      test "$CODE" -ge 200 && test "$CODE" -lt 300

gitleaks_send_asoc:
  stage: report
  extends: .send_asoc_rules
  image:
    name: python:3.12-alpine
  needs:
    - job: gitleaks
      artifacts: true
  before_script:
    - apk add --no-cache curl ca-certificates
  script:
    - set -e
    - ASOC_INGEST_URL="${ASOC_INGEST_URL:-https://atomic-asoc.ru/api/v1/findings/ingest}"
    - test -f gitleaks-report.json || echo '[]' > gitleaks-report.json
    - python3 ci/gitleaks_to_asoc_payload.py gitleaks-report.json > ingest-gitleaks.json
    - |
      set -e
      if [ -n "${ASOC_CONSOLE_JWT:-}" ]; then
        CODE=$(curl -sS -o /tmp/asoc-gitleaks.body -w "%{http_code}" -X POST "$ASOC_INGEST_URL" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${ASOC_CONSOLE_JWT}" \
          --data-binary @ingest-gitleaks.json)
      elif [ -n "${ASOC_API_KEY:-}" ]; then
        CODE=$(curl -sS -o /tmp/asoc-gitleaks.body -w "%{http_code}" -X POST "$ASOC_INGEST_URL" \
          -H "Content-Type: application/json" \
          -H "X-API-Key: ${ASOC_API_KEY}" \
          --data-binary @ingest-gitleaks.json)
      else
        echo "Set ASOC_CONSOLE_JWT or ASOC_API_KEY" >&2
        exit 1
      fi
      echo "HTTP ${CODE}"
      cat /tmp/asoc-gitleaks.body
      test "$CODE" -ge 200 && test "$CODE" -lt 300
