# Пример values для официального Helm chart GitLab Runner в Kubernetes.
# Chart: https://gitlab.com/gitlab-org/charts/gitlab-runner
#
# Актуальный файл для кластера lavinia: ../../deploy/k8s/gitlab-runner-values.yaml (токен только через --set / CI секрет).
#
#   helm repo add gitlab https://charts.gitlab.io
#   helm upgrade --install asoc-ci-runner gitlab/gitlab-runner \
#     --namespace gitlab-runner --create-namespace \
#     -f deploy/k8s/gitlab-runner-values.yaml \
#     --set runnerRegistrationToken="$GL_RUNNER_TOKEN"
#
# Перед применением:
# 1) gitlabUrl — ваш GitLab (https://gitlab.com или URL инстанса за Ingress).
# 2) runnerRegistrationToken — из GitLab: Settings → CI/CD → Runners → New project runner.

gitlabUrl: "https://gitlab.com/"

runnerRegistrationToken: "REPLACE_WITH_GITLAB_TOKEN"

rbac:
  create: true

# Раннер создаёт Pod’ы в этом namespace; chart обычно использует namespace релиза.
runners:
  config: |
    [[runners]]
      [runners.kubernetes]
        image = "alpine:3.20"
        # Образы semgrep/gitleaks задаются в .gitlab-ci.yml джобов — runner их подтянет как job-контейнеры.
