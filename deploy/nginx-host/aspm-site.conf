# Пример виртуального хоста: фронт (статика) + прокси API к docker-compose на localhost.
# Установка: см. deploy/nginx-host/README.md
#
# Подставь абсолютный путь к web/dist (после npm run build в mephi_vkr_aspm/web).

server {
    listen 80;
    server_name _;

    root /var/www/aspm/web/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Публичное API и Swagger (api-service)
    location /api/v1/scans {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /openapi.yaml {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /swagger {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
    }

    location /api/v1/sync {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/v1/findings {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /api/v1/groups {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/v1/tickets {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
