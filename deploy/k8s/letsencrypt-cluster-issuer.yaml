# ClusterIssuer (кластер). kubectl apply -f deploy/k8s/letsencrypt-cluster-issuer.yaml
# Замените email при необходимости.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: timur712@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
