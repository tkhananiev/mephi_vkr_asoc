# Скопируй в secret.yaml, подставь пароли. Не коммитить secret.yaml с боевыми значениями.
# kubectl apply -f secret.yaml -n aspm
apiVersion: v1
kind: Secret
metadata:
  name: aspm-secrets
  namespace: aspm
type: Opaque
stringData:
  # Должен совпадать с паролем в postgres-dsn (после aspm:)
  postgres-password: "CHANGEME"
  postgres-dsn: "postgres://aspm:CHANGEME@postgres:5432/aspm?sslmode=disable"
  api-auth-key: "CHANGEME_API_KEY"
