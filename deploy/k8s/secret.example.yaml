# Скопируй в secret.yaml, подставь пароли. Не коммитить secret.yaml с боевыми значениями.
# kubectl apply -f secret.yaml -n asoc
#
# Приватный Container Registry Selectel (pull образов cr.selcloud.ru/atomic-asoc/*): секрет типа docker-registry,
# имя должно совпадать с imagePullSecrets в манифестах — selcloud-registry.
# Логин/пароль или token — из панели Selectel по проекту registry «atomic-asoc»:
#   kubectl create secret docker-registry selcloud-registry \
#     --docker-server=cr.selcloud.ru \
#     --docker-username='<USERNAME_OR_TOKEN_ID>' \
#     --docker-password='<PASSWORD_OR_TOKEN_SECRET>' \
#     -n asoc
apiVersion: v1
kind: Secret
metadata:
  name: asoc-secrets
  namespace: asoc
type: Opaque
stringData:
  # По умолчанию как при локальной сборке Postgres (deploy/compose.yaml): пользователь asoc, пароль asoc
  postgres-password: "asoc"
  postgres-dsn: "postgres://asoc:asoc@postgres:5432/asoc?sslmode=disable"
  # Ключ для X-API-Key / legacy Bearer
  api-auth-key: "REPLACE_WITH_STAND_API_KEY_____________"
  # ≥32 символов: один и тот же секрет задаётся как APP_JWT_SECRET (api-service) и AUTH_JWT_SECRET (auth-service).
  jwt-secret: "REPLACE_WITH_RANDOM_32_PLUS_CHARS______________"
  # Однократное создание первого Asoc-admin при пустой таблице authn.admins (см. AUTH_BOOTSTRAP_* в workloads).
  # Можно удалить ключи после первого деплоя или оставить — при ненулевом числе админов bootstrap не выполняется.
  auth-bootstrap-admin-login: "asoc-admin"
  auth-bootstrap-admin-password: "REPLACE_STRONG_PASSWORD_MIN_8_CHARS______"
  # SMTP для отправки кода подтверждения регистрации (auth-service)
  smtp-login: "8512"
  smtp-api-key: "REPLACE_SMTP_API_KEY"
