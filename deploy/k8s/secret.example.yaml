# Скопируй в secret.yaml, подставь пароли. Не коммитить secret.yaml с боевыми значениями.
# kubectl apply -f secret.yaml -n asoc
apiVersion: v1
kind: Secret
metadata:
  name: asoc-secrets
  namespace: asoc
type: Opaque
stringData:
  # Должен совпадать с паролем в postgres-dsn (после asoc:)
  postgres-password: "CHANGEME"
  postgres-dsn: "postgres://asoc:CHANGEME@postgres:5432/asoc?sslmode=disable"
  api-auth-key: "CHANGEME_API_KEY"
