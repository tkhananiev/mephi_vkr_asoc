# ServiceAccount + RBAC: api-service читает логи подов и патчит Deployments (admin UI).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-service
  namespace: asoc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-pod-ops
  namespace: asoc
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-pod-ops
  namespace: asoc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api-pod-ops
subjects:
  - kind: ServiceAccount
    name: api-service
    namespace: asoc
