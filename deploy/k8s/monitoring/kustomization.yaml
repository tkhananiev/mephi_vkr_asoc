# ConfigMap'ы с дашбордами ASOC и Defect Dojo для Grafana sidecar (лейбл grafana_dashboard).
# kubectl apply -k deploy/k8s/monitoring
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

generatorOptions:
  disableNameSuffixHash: true

labels:
  - pairs:
      grafana_dashboard: "1"
    includeSelectors: false

configMapGenerator:
  - name: grafana-dashboard-asoc-loadtest
    files:
      - grafana-dashboard-asoc-loadtest.json
  - name: grafana-dashboard-defectdojo-loadtest
    files:
      - grafana-dashboard-defectdojo-loadtest.json
