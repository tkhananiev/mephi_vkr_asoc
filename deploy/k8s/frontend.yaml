# Статика + reverse proxy (см. mephi_vkr_asoc_front/nginx/default.conf). Образ: cr.selcloud.ru/atomic-asoc/web:latest
---
apiVersion: v1
kind: Service
metadata:
  name: asoc-web
  namespace: asoc
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: asoc-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asoc-web
  namespace: asoc
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: asoc-web
  template:
    metadata:
      labels:
        app: asoc-web
    spec:
      imagePullSecrets:
        - name: selcloud-registry
      containers:
        - name: web
          image: cr.selcloud.ru/atomic-asoc/web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
