# Скрап /metrics api-service в Prometheus (kube-prometheus-stack, release kps).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-service
  namespace: asoc
  labels:
    release: kps
spec:
  namespaceSelector:
    matchNames:
      - asoc
  selector:
    matchLabels:
      app: api-service
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
