apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: asoc

resources:
  - namespace.yaml
  - public-urls.yaml
  - postgres.yaml
  - kafka.yaml
  - bdu-catalog-pvc.yaml
  - api-pod-ops-rbac.yaml
  - api-service-servicemonitor.yaml
  - workloads.yaml
  # hpa.yaml — отключён для сопоставимого НТ с Defect Dojo (1 реплика, без autoscale).
  # Включить обратно: раскомментировать строку ниже и kubectl apply -f deploy/k8s/hpa.yaml
  # - hpa.yaml
  - frontend.yaml
  - ingress.yaml

configMapGenerator:
  - name: asoc-migrations
    options:
      disableNameSuffixHash: true
    files:
      - ../../migrations/001_reference_schema.sql
      - ../../migrations/002_processing_schema.sql
      - ../../migrations/003_integration_schema.sql
      - ../../migrations/004_demo_seed.sql
      - ../../migrations/005_demo_cwe_alias.sql
      - ../../migrations/006_reference_sync_cursor.sql
      - ../../migrations/007_app_users.sql
      - ../../migrations/008_authorization_schema.sql
      - ../../migrations/009_admins_disabled.sql
      - ../../migrations/010_console_user_display_name.sql
      - ../../migrations/011_console_user_fio_username.sql
      - ../../migrations/012_pending_registrations.sql
      - ../../migrations/013_demo_cwe89_alias.sql
      - ../../migrations/014_console_products_and_run_owner.sql
      - ../../migrations/015_processing_run_channel.sql
      - ../../migrations/016_console_product_branch_refs.sql
      - ../../migrations/017_processing_run_console_product.sql
