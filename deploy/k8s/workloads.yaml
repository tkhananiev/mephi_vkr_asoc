apiVersion: v1
kind: Service
metadata:
  name: generic-scan-runner
  namespace: asoc
spec:
  ports:
    - port: 8087
      targetPort: 8087
  selector:
    app: generic-scan-runner
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: generic-scan-runner
  namespace: asoc
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: generic-scan-runner
  template:
    metadata:
      labels:
        app: generic-scan-runner
    spec:
      imagePullSecrets:
        - name: selcloud-registry
      containers:
