---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: aspm
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: api-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: aspm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      initContainers:
        - name: wait-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka 9092; do echo waiting kafka; sleep 2; done"]
      containers:
        - name: app
          image: aspm/api-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: APP_HTTP_PORT
              value: "8080"
            - name: APP_PROCESSING_SERVICE_URL
              value: http://processing-service:8082
            - name: APP_JIRA_SERVICE_URL
              value: http://jira-integration-service:8083
            - name: APP_SEMGREP_SERVICE_URL
              value: http://semgrep-service:8085
            - name: APP_KAFKA_BROKERS
              value: kafka:9092
            - name: APP_DEFAULT_SCAN_TARGET_PATH
              value: /app/demo/vulnerable-app
            - name: APP_DEFAULT_SEMGREP_CONFIG
              value: /app/demo/semgrep-rules.yml
            - name: APP_AUTH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aspm-secrets
                  key: api-auth-key
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
