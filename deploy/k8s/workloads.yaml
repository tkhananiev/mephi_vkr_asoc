apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: asoc
spec:
  ports:
    - port: 8091
      targetPort: 8091
  selector:
    app: auth-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: asoc
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      imagePullSecrets:
        - name: selcloud-registry
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting postgres; sleep 2; done"]
      containers:
        - name: app
          image: cr.selcloud.ru/atomic-asoc/auth:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8091
          env:
            - name: AUTH_HTTP_PORT
              value: "8091"
            - name: AUTH_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: asoc-secrets
                  key: postgres-dsn
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: asoc-secrets
                  key: jwt-secret
            - name: AUTH_JWT_TTL
              value: "168h"
            - name: AUTH_BOOTSTRAP_ADMIN_LOGIN
              valueFrom:
                secretKeyRef:
                  name: asoc-secrets
                  key: auth-bootstrap-admin-login
                  optional: true
            - name: AUTH_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: asoc-secrets
                  key: auth-bootstrap-admin-password
                  optional: true
            - name: AUTH_SMTP_HOST
              value: smtp.mail.selcloud.ru
            - name: AUTH_SMTP_PORT
              value: "1126"
            - name: AUTH_SMTP_LOGIN
              valueFrom:
                secretKeyRef:
                  name: asoc-secrets
                  key: smtp-login
            - name: AUTH_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: asoc-secrets
                  key: smtp-api-key
            - name: AUTH_SMTP_FROM
              value: no-reply@atomic-asoc.ru
          readinessProbe:
            httpGet:
              path: /health
              port: 8091
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: asoc
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: api-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: asoc
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      serviceAccountName: api-service
      imagePullSecrets:
        - name: selcloud-registry
      initContainers:
        - name: wait-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka 9092; do echo waiting kafka; sleep 2; done"]
      volumes:
        - name: integration-overlay
          emptyDir: {}
      containers:
        - name: app
          image: cr.selcloud.ru/atomic-asoc/api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: APP_HTTP_PORT
              value: "8080"
            - name: APP_PROCESSING_SERVICE_URL
              value: http://processing-service:8082
            - name: APP_JIRA_SERVICE_URL
              value: http://jira-integration-service:8083
            - name: APP_SEMGREP_SERVICE_URL
              value: http://semgrep-service:8085
            - name: APP_GITLEAKS_SERVICE_URL
              value: http://gitleaks-service:8086
            - name: APP_KAFKA_BROKERS
              value: kafka:9092
            - name: APP_REQUIRE_KAFKA_FOR_FINDINGS_INGEST
              value: "true"
            - name: APP_DEFAULT_SCAN_TARGET_PATH
              value: /app/demo/scan-targets/WebGoat/
            - name: APP_DEFAULT_SEMGREP_CONFIG
              value: p/java
            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: asoc-secrets
                  key: jwt-secret
            - name: APP_AUTH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: asoc-secrets
                  key: api-auth-key
            - name: APP_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: asoc-secrets
                  key: postgres-dsn
            - name: APP_K8S_OPS_ENABLED
              value: "true"
            - name: APP_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: APP_INTEGRATIONS_OVERLAY_PATH
              value: /var/asoc-overlay/integration-overlay.json
          volumeMounts:
            - name: integration-overlay
              mountPath: /var/asoc-overlay
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 768Mi
