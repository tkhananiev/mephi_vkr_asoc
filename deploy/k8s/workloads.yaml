---
apiVersion: v1
kind: Service
metadata:
  name: semgrep-service
  namespace: asoc
spec:
  ports:
    - port: 8085
      targetPort: 8085
  selector:
    app: semgrep-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: semgrep-service
  namespace: asoc
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: semgrep-service
  template:
    metadata:
      labels:
        app: semgrep-service
    spec:
      imagePullSecrets:
        - name: selcloud-registry
      volumes:
        - name: semgrep-git-work
          emptyDir: {}
      containers:
        - name: app
          image: cr.selcloud.ru/atomic-asoc/semgrep:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8085
          env:
            - name: APP_HTTP_PORT
              value: "8085"
            - name: APP_SEMGREP_CONFIG
              value: p/java
            - name: APP_DEFAULT_SCAN_TARGET_PATH
              value: /app/demo/scan-targets/WebGoat/
            - name: APP_SEMGREP_GIT_WORK_ROOT
              value: /var/asoc-semgrep-git
          volumeMounts:
            - name: semgrep-git-work
              mountPath: /var/asoc-semgrep-git
          readinessProbe:
            httpGet:
              path: /health
              port: 8085
