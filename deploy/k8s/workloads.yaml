# Образы собираются из корня репозитория: см. README в этой папке.
# imagePullPolicy: IfNotPresent — для minikube после local docker build.
---
apiVersion: v1
kind: Service
metadata:
  name: reference-data-service
  namespace: aspm
spec:
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: reference-data-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reference-data-service
  namespace: aspm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reference-data-service
  template:
    metadata:
      labels:
        app: reference-data-service
    spec:
      containers:
        - name: app
          image: aspm/reference-data-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: APP_HTTP_PORT
              value: "8081"
            - name: APP_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: aspm-secrets
                  key: postgres-dsn
            - name: APP_KAFKA_BROKERS
              value: kafka:9092
            - name: APP_BDU_FEED_URL
              value: https://bdu.fstec.ru/ubi/vul/rss
            - name: APP_BDU_INSECURE_SKIP_VERIFY
              value: "true"
            - name: APP_NVD_API_BASE_URL
              value: https://services.nvd.nist.gov/rest/json/cves/2.0
            - name: APP_SYNC_SCHEDULER_ENABLED
              value: "true"
            - name: APP_SYNC_INITIAL_DELAY
              value: 1m
            - name: APP_SYNC_INTERVAL
              value: 24h
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
---
