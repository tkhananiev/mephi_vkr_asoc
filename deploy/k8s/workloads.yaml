# Образы: cr.selcloud.ru/atomic-asoc/<имя>:latest (Container Registry Selectel), см. Deployments ниже.
---
apiVersion: v1
kind: Service
metadata:
  name: reference-data-service
  namespace: asoc
spec:
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: reference-data-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reference-data-service
  namespace: asoc
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: reference-data-service
  template:
    metadata:
      labels:
        app: reference-data-service
    spec:
      imagePullSecrets:
        - name: selcloud-registry
      containers:
        - name: app
          image: cr.selcloud.ru/atomic-asoc/reference-data:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: APP_HTTP_PORT
              value: "8081"
            - name: APP_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: asoc-secrets
                  key: postgres-dsn
            - name: APP_KAFKA_BROKERS
              value: kafka:9092
            - name: APP_BDU_FEED_URL
              value: https://bdu.fstec.ru/ubi/vul/rss
            - name: APP_BDU_INSECURE_SKIP_VERIFY
              value: "true"
            - name: APP_NVD_API_BASE_URL
              value: https://services.nvd.nist.gov/rest/json/cves/2.0
            - name: APP_SYNC_SCHEDULER_ENABLED
              value: "true"
            - name: APP_SYNC_INITIAL_DELAY
              value: 1m
            - name: APP_SYNC_INTERVAL
              value: 24h
            # Полный импорт POST /api/v1/sync/bdu/bulk — файлы в образе (/opt/asoc/bdu-default/… см. Dockerfile).
            - name: APP_BDU_BULK_ENABLED
              value: "true"
            - name: APP_BDU_VULXML_ZIP_PATH
              value: /opt/asoc/bdu-default/vulxml.zip
            - name: APP_BDU_VULLIST_XLSX_PATH
              value: /opt/asoc/bdu-default/vullist.xlsx
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
---
