# Nginx внутри образа aspm/web — для Kubernetes (тот namespace, что и бэкенды).
# Upstream-имена = Service в кластере (порт — как в workloads.yaml).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/scans {
        proxy_pass http://api-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /openapi.yaml {
        proxy_pass http://api-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /swagger {
        proxy_pass http://api-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /health {
        proxy_pass http://api-service:8080;
        proxy_http_version 1.1;
    }

    location /api/v1/sync {
        proxy_pass http://reference-data-service:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/v1/findings {
        proxy_pass http://processing-service:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /api/v1/groups {
        proxy_pass http://processing-service:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/v1/tickets {
        proxy_pass http://jira-integration-service:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
